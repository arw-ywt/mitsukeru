[package]
name = "mitsukeru-core"
version = "0.1.0"
edition = "2024"
description = "Lightweight, deterministic, and explainable constraint optimization engine written in Pure Rust"
license = "MIT"
repository = "https://github.com/arw-ywt/mitsukeru"
keywords = ["knapsack", "optimization", "sat", "solver"]
categories = ["algorithms", "science"]
readme = "../../README.md"

[lib]
name = "mitsukeru"

[features]
default = ["std"]
std = [
    "serde/std",
    "serde_json/std",
    "schemars",
    "dep:web-time",
]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
schemars = { version = "0.8", optional = true }
web-time = { version = "1.1", optional = true }
libm = "0.2"

[lints]
workspace = true

[[bench]]
name = "solver_bench"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }