[workspace]
resolver = "2"
members = [
    "crates/mitsukeru-core",
    "crates/mitsukeru-wasm",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/arw-ywt/mitsukeru"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"

unwrap_used = "warn"
panic = "warn"
as_conversions = "warn"
cast_precision_loss = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

[profile.release]
opt-level = 's'
lto = "thin"
panic = "abort"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1