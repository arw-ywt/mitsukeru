[package]
name = "mitsukeru"
version = "0.1.0"
edition = "2024"
description = "Lightweight, deterministic, and explainable constraint optimization engine written in Pure Rust"
license = "MIT"
repository = "https://github.com/arw-ywt/mitsukeru"
keywords = ["knapsack", "optimization", "sat", "solver", "wasm"]
categories = ["algorithms", "science", "wasm"]
readme = "README.md"
include = [
    "/src/**/*",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
schemars = "0.8"
web-time = "1.1"

[[bench]]
name = "solver_bench"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 's'
lto = "thin"
panic = "abort"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "fat"
panic = "abort"
codegen-units = 1