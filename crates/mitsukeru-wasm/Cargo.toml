[package]
name = "mitsukeru-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings for mitsukeru"

[lib]
name = "mitsukeru"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
mitsukeru = { package = "mitsukeru-core", path = "../mitsukeru-core" }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1.0", features = ["derive"] }