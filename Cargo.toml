[package]
name = "mitsukeru"
version = "0.1.0"
edition = "2024"
description = "Lightweight, explainable, sub-millisecond decision and configuration engine for Web and Rust"
license = "MIT"
repository = "https://github.com/arw-ywt/mitsukeru"
keywords = ["knapsack", "optimization", "sat", "solver", "wasm"]
categories = ["algorithms", "science", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
schemars = "0.8"
web-time = "1.1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "solver_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 0
panic = "abort"

[profile.bench]
panic = "abort"