[package]
name = "mitsukeru-wasm"
version.workspace = true
rust-version = "1.88"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors = ["arw-ywt"]
description = "Deterministic, explainable constraint optimization engine (WebAssembly)"
homepage = "https://arw-ywt.github.io/mitsukeru/"
keywords = ["knapsack", "optimization", "sat", "solver"]
categories = ["algorithms", "science"]
readme = "../../README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
mitsukeru = { path = "../mitsukeru-core", default-features = false, features = ["std", "serde"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1.0", features = ["derive"] }